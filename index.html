<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Privacy information for Xcreen." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Xcreen</title>
    <style>
      :root {
        color-scheme: light;
        --background: #f7f5f0;
        --surface: #ffffff;
        --ink: #16181d;
        --muted: #69707d;
        --border: #e2ded5;
        --accent: #315ef5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--background);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(720px, calc(100% - 40px));
        margin: 0 auto;
        padding: 72px 0;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        margin-bottom: 48px;
      }

      .mark {
        display: grid;
        width: 48px;
        height: 48px;
        place-items: center;
        border-radius: 14px;
        background: var(--accent);
        color: #ffffff;
        font-size: 30px;
        font-weight: 800;
        line-height: 1;
      }

      .brand-name {
        margin: 0;
        font-size: 26px;
        font-weight: 750;
        letter-spacing: -0.02em;
      }

      .brand-tagline {
        margin: -3px 0 0;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
      }

      .card {
        padding: clamp(28px, 6vw, 52px);
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: 0 20px 60px rgb(22 24 29 / 7%);
      }

      h1 {
        margin: 0;
        font-size: clamp(38px, 8vw, 56px);
        line-height: 1.05;
        letter-spacing: -0.045em;
      }

      p {
        margin: 18px 0 0;
        color: var(--muted);
      }

      a {
        color: var(--accent);
        font-weight: 650;
      }

      .primary-link {
        display: inline-flex;
        margin-top: 30px;
        padding: 12px 18px;
        border-radius: 999px;
        background: var(--accent);
        color: #ffffff;
        text-decoration: none;
      }

      footer {
        margin-top: 28px;
        color: var(--muted);
        font-size: 13px;
        text-align: center;
      }

      @media (max-width: 520px) {
        main {
          width: min(100% - 24px, 720px);
          padding: 28px 0;
        }

        .brand {
          margin: 0 12px 28px;
        }

        .card {
          border-radius: 22px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="brand">
        <div class="mark" aria-hidden="true">X</div>
        <div>
          <p class="brand-name">Xcreen</p>
          <p class="brand-tagline">SCREEN CLEANING MODE</p>
        </div>
      </header>

      <section class="card">
        <h1>Simple utility.<br />Clear privacy.</h1>
        <p>
          Xcreen helps you clean your screen without worrying about accidental
          taps. Learn how the app and the services needed for ads and purchases
          handle information.
        </p>
        <a class="primary-link" href="./privacy/">Read the privacy policy</a>
      </section>

      <footer>&copy; 2026 Xcreen</footer>
    </main>
  </body>
</html>
